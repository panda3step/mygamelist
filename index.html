<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="老王的游戏导航页">
    <title>老王游戏主页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #121212;
            color: #ffffff;
        }

        .App {
            text-align: center;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .App-header {
            margin-bottom: 40px;
        }

        .App-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .App-subtitle {
            color: #888;
            font-size: 1rem;
        }

        /* 游戏九宫格网格布局 */
        .Game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        /* 游戏卡片样式 */
        .Game-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .Game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 75, 43, 0.2);
            border-color: #ff4b2b;
            background-color: #252525;
        }

        .Game-icon { font-size: 2.5rem; margin-bottom: 15px; }
        .Game-name { font-size: 1.2rem; font-weight: bold; }

        /* ===================== 游戏舞台 ===================== */
        #Game-stage {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000000;
            z-index: 9999;
        }

        /* 侧边栏容器 */
        .Game-sidebar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            width: 160px;
            background: #161616;
            border-right: 1px solid #2a2a2a;
            padding:12px 8px;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 10002;
        }
        /* 移动端收起状态 */
        .Game-sidebar.collapsed{
            transform: translateX(-100%);
        }

        .Sidebar-title{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:8px 4px;
            font-size:14px;
            color:#aaa;
            border-bottom:1px solid #2a2a2a;
            margin-bottom:10px;
        }
        .Sidebar-close{
            background:none;
            border:none;
            color:#888;
            cursor:pointer;
            font-size:18px;
        }
        .Sidebar-game-item{
            display:flex;
            align-items:center;
            gap:8px;
            padding:10px 8px;
            border-radius:8px;
            cursor:pointer;
            transition:0.2s;
            margin-bottom:4px;
        }
        .Sidebar-game-item:hover{
            background:#222;
        }
        .Sidebar-game-item.active{
            background:#2c191c;
            border:1px solid #ff4b2b;
        }
        .Sidebar-icon{
            font-size:22px;
        }
        .Sidebar-text{
            font-size:13px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        /* 侧边栏呼出按钮（手机显示） */
        .Sidebar-toggle-btn{
            display:none;
            position:absolute;
            top:15px;
            left:15px;
            width:40px;
            height:40px;
            border-radius:50%;
            background-color:rgba(255,255,255,0.2);
            color:#fff;
            border:none;
            font-size:20px;
            z-index:10003;
            cursor:pointer;
        }
        .Sidebar-toggle-btn:hover{
            background:rgba(255, 65, 108, 0.8);
        }

        /* 游戏主体区域 */
        .Game-main-wrap{
            width:100%;
            height:100%;
            position:relative;
        }

        #Game-frame {
            width: 100%; height: 100%; border: none;
            display: block;
        }

        .Close-game-btn {
            position: absolute; top: 15px; right: 15px;
            width: 40px; height: 40px; border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff; border: none; font-size: 1.5rem;
            cursor: pointer; z-index: 10001; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .Close-game-btn:hover { background-color: rgba(255, 65, 108, 0.8); }

        #Loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
            display:none;
        }

        .Spinner {
            width: 50px; height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #ff4b2b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 15px rgba(255, 75, 43, 0.5);
        }

        .Loading-text {
            margin-top: 20px; color: #ff4b2b; font-weight: bold;
            letter-spacing: 2px; font-size: 1.1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* ==========响应式规则========== */
        @media (max-width: 768px) {
            .Game-sidebar{
                transform: translateX(-100%);
            }
            .Game-sidebar.open{
                transform: translateX(0);
            }
            .Sidebar-toggle-btn{
                display:block;
            }
        }

        @media (max-width: 480px) {
            .App-title { font-size: 2rem; }
            .Game-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .Game-card { padding: 20px 10px; }
            .Game-name { font-size: 1rem; }
        }
    </style>
</head>

<body>
    <div class="App">
        <header class="App-header">
            <h1 class="App-title">gamelist</h1>
            <p class="App-subtitle">点击下方卡片，立即开始游戏</p>
        </header>

        <main class="Game-grid">
             <div class="Game-card" onclick="playGame('./findpanda7/')" data-url="./findpanda7/" data-icon="🐼" data-name="FindPanda by Unity">
                <div class="Game-icon">🐼</div>
                <div class="Game-name">找熊猫 by Unity 7</div>
            </div>

            <!-- <div class="Game-card" onclick="playGame('./arrow7/')" data-url="./arrow7/" data-icon="➡️" data-name="找箭头">
                <div class="Game-icon">➡️</div>
                <div class="Game-name">找箭头</div>
            </div> -->

            <div class="Game-card" onclick="playGame('./ylgy/')" data-url="./ylgy/" data-icon="🐑" data-name="羊了个羊">
                <div class="Game-icon">🐑</div>
                <div class="Game-name">羊了个羊</div>
            </div>

            <div class="Game-card" onclick="playGame('./nutbolts/')" data-url="./nutbolts/" data-icon="🔩" data-name="螺丝玻璃谜题">
                <div class="Game-icon">🔩</div>
                <div class="Game-name">螺丝玻璃谜题</div>
            </div>

            <div class="Game-card" onclick="playGame('./nutsandbolts/')" data-url="./nutsandbolts/" data-icon="🔧" data-name="螺帽与螺栓">
                <div class="Game-icon">🔧</div>
                <div class="Game-name">螺帽与螺栓</div>
            </div>

            <div class="Game-card" onclick="playGame('./sandblast/')" data-url="./sandblast/" data-icon="⏳" data-name="沙子方块">
                <div class="Game-icon">⏳</div>
                <div class="Game-name">沙子方块</div>
            </div>

            <div class="Game-card" onclick="playGame('./castledefense/')" data-url="./castledefense/" data-icon="🏰" data-name="城堡防御">
                <div class="Game-icon">🏰</div>
                <div class="Game-name">城堡防御</div>
            </div>

            <div class="Game-card" onclick="playGame('./crosscolor/')" data-url="./crosscolor/" data-icon="🎨" data-name="交叉色彩">
                <div class="Game-icon">🎨</div>
                <div class="Game-name">交叉色彩</div>
            </div>

            <div class="Game-card" onclick="playGame('./jumptojump/')" data-url="./jumptojump/" data-icon="🏃" data-name="跳一跳">
                <div class="Game-icon">🏃</div>
                <div class="Game-name">跳一跳</div>
            </div>

            <div class="Game-card" onclick="playGame('./luosiding/')" data-url="./luosiding/" data-icon="⚙️" data-name="螺丝钉">
                <div class="Game-icon">⚙️</div>
                <div class="Game-name">螺丝钉</div>
            </div>

            <div class="Game-card" onclick="playGame('./waves/')" data-url="./waves/" data-icon="🌊" data-name="波浪冲击">
                <div class="Game-icon">🌊</div>
                <div class="Game-name">波浪冲击</div>
            </div>
        </main>
    </div>

    <div id="Game-stage">
        <!-- 移动端侧边呼出按钮 -->
        <button class="Sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>

        <!-- 左侧游戏切换侧边栏 -->
        <div class="Game-sidebar" id="sidebarBox">
            <div class="Sidebar-title">
                <span>游戏列表</span>
                <button class="Sidebar-close" onclick="closeSidebar()">✕</button>
            </div>
            <div id="sidebarList"></div>
        </div>

        <!-- 游戏主区域 -->
        <div class="Game-main-wrap">
            <button class="Close-game-btn" onclick="closeGame()">×</button>
            <div id="Loading-screen">
                <div class="Spinner"></div>
                <div class="Loading-text">游戏资源载入中...</div>
            </div>
            <iframe id="Game-frame" src="" scrolling="no"></iframe>
        </div>
    </div>

    <script>
        const gameStage = document.getElementById('Game-stage');
        const gameFrame = document.getElementById('Game-frame');
        const loadingScreen = document.getElementById('Loading-screen');
        const sidebarList = document.getElementById('sidebarList');
        const sidebarBox = document.getElementById('sidebarBox');

        // 收集所有游戏数据
        const gameCards = Array.from(document.querySelectorAll('.Game-card'));
        const gameList = gameCards.map(card => ({
            url: card.dataset.url,
            icon: card.dataset.icon,
            name: card.dataset.name
        }));

        let currentGameUrl = "";

        // 渲染侧边栏列表
        function renderSidebar(){
            sidebarList.innerHTML = "";
            gameList.forEach(game=>{
                const div = document.createElement('div');
                div.className = "Sidebar-game-item";
                div.dataset.url = game.url;
                div.innerHTML = `
                    <span class="Sidebar-icon">${game.icon}</span>
                    <span class="Sidebar-text">${game.name}</span>
                `;
                div.onclick = ()=> switchGame(game.url);
                sidebarList.appendChild(div);
            })
        }
        renderSidebar();

        // 更新当前选中高亮
        function updateActiveSidebar(){
            document.querySelectorAll('.Sidebar-game-item').forEach(item=>{
                if(item.dataset.url === currentGameUrl){
                    item.classList.add('active');
                }else{
                    item.classList.remove('active');
                }
            })
        }

        // 侧边栏开关
        function toggleSidebar(){
            sidebarBox.classList.toggle('open');
        }
        function closeSidebar(){
            sidebarBox.classList.remove('open');
        }

        // 切换游戏（侧边栏点击调用）
        function switchGame(gameUrl){
            loadingScreen.style.display = 'flex';
            gameFrame.src = gameUrl;
            currentGameUrl = gameUrl;
            updateActiveSidebar();
        }

        // 大厅卡片点击启动游戏
        function playGame(gameUrl) {
            gameStage.style.display = 'block';
            document.body.style.overflow = 'hidden';
            currentGameUrl = gameUrl;
            loadingScreen.style.display = 'flex';
            gameFrame.src = gameUrl;
            updateActiveSidebar();
        }

        // iframe加载完成隐藏loading
        gameFrame.onload = function() {
            if (gameFrame.src) {
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 300);
            }
        };

        // 关闭游戏返回大厅
        function closeGame() {
            gameStage.style.display = 'none';
            gameFrame.src = '';
            currentGameUrl = "";
            document.body.style.overflow = 'auto';
            sidebarBox.classList.remove('open');
        }
    </script>
</body>

</html>
